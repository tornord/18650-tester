<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battery Parameters Form</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        background-color: #f9f9f9;
      }
      form {
        background: white;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      }
      fieldset {
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        margin-bottom: 20px;
        padding: 16px;
      }
      legend {
        font-weight: bold;
        padding: 0 8px;
        color: #333;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
        gap: 10px;
        margin-top: 10px;
      }
      .option {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 14px;
      }
      button {
        background-color: #0066cc;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
      }
      button:hover {
        background-color: #0052a3;
      }
    </style>
  </head>
  <body>
    <form id="paramForm">
      <fieldset>
        <legend>Capacity</legend>
        <div class="grid">
          <script>
            for (let i = 1800; i <= 3200; i += 100) {
              document.write(`
                            <label class="option">
                                <input type="radio" name="capacity" value="${i}" ${i === 1800 ? "checked" : ""}>
                                ${i}
                            </label>
                        `);
            }
          </script>
        </div>
      </fieldset>

      <fieldset>
        <legend>Internal Resistance</legend>
        <div class="grid">
          <script>
            for (let i = 10; i <= 150; i += 10) {
              document.write(`
                            <label class="option">
                                <input type="radio" name="internalResistance" value="${i}" ${i === 10 ? "checked" : ""}>
                                ${i}
                            </label>
                        `);
            }
          </script>
        </div>
      </fieldset>

      <button type="submit">Submit</button>
    </form>

    <script>
      document.getElementById("paramForm").addEventListener("submit", function (e) {
        e.preventDefault(); // Stop standard form submission

        // Get selected values
        const capacityRaw = document.querySelector('input[name="capacity"]:checked').value;
        const irRaw = document.querySelector('input[name="internalResistance"]:checked').value;

        // Convert values (divide by 1000)
        const capacityVal = capacityRaw / 1000;
        const irVal = irRaw / 1000;

        // Redirect to the formatted URL on the same site
        window.location.href = `/print?capacity=${capacityVal}&internalResistance=${irVal}`;
      });
    </script>
  </body>
</html>
